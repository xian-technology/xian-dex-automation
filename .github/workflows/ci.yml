name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"

    defaults:
      run:
        working-directory: xian-dex-automation

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: xian-dex-automation

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-contracting
          path: xian-contracting

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-py
          path: xian-py

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync locked workspace dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --locked --extra dev ruff check .

      - name: Test
        run: uv run --locked --extra dev pytest

      - name: Compile
        run: uv run --locked --extra dev python -m compileall src tests
